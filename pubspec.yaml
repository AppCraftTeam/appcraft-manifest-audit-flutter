name: appcraft_manifest_audit
description: >-
  Attributes every permission and component of the merged Android manifest to
  the library that injected it, and freezes the answer in a baseline that fails
  CI when it changes.
version: 0.0.1
repository: https://github.com/AppCraftTeam/appcraft-manifest-audit-flutter
issue_tracker: https://github.com/AppCraftTeam/appcraft-manifest-audit-flutter/issues

topics:
  - android
  - manifest
  - permissions
  - cli
  - ci

environment:
  sdk: ^3.0.0

executables:
  appcraft_manifest_audit:

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  xml: ^6.5.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
